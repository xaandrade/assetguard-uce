version: '3.8'

services:
  # --- BASES DE DATOS ---
  mysql-db:
    image: mysql:8.0
    container_name: assetguard-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: assetguard_db
    ports:
      - "3306:3306"

  mongo-db:
    image: mongo:latest
    container_name: assetguard-mongo
    ports:
      - "27017:27017"

  redis-cache:
    image: redis:alpine
    container_name: assetguard-redis
    ports:
      - "6379:6379"

  # --- MENSAJERÍA ---
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: assetguard-zookeeper
    ports:
      - "2181:2181"

  kafka:
    image: wurstmeister/kafka
    container_name: assetguard-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_ADVERTISED_HOST_NAME: kafka
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
    depends_on:
      - zookeeper

  # --- API GATEWAY ---
  api-gateway:
    build: ./gateway/api-gateway
    container_name: api-gateway
    ports:
      - "3000:3000"
    depends_on:
      - security-service

  # --- TUS 10 MICROSERVICIOS REALES ---
  audit-service:
    build: ./services/audit-service
    ports: ["3001:3001"]
  
  depreciation-service:
    build: ./services/depreciation-service
    ports: ["3002:3002"]

  fixed-assets-service:
    build: ./services/fixed-assets-service
    ports: ["3003:3003"]

  inventory-service:
    build: ./services/inventory-service
    ports: ["3004:3004"]

  notification-service:
    build: ./services/notification-service
    ports: ["3005:3005"]

  purchasing-service:
    build: ./services/purchasing-service
    ports: ["3006:3006"]

  reporting-service:
    build: ./services/reporting-service
    ports: ["3007:3007"]

  security-service:
    build: ./services/security-service
    ports: ["3008:3008"]

  tracking-service:
    build: ./services/tracking-service
    ports: ["3009:3009"]

  user-service:
    build: ./services/user-service
    ports: ["3010:3010"]