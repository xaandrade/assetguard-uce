version: '3.8'

services:
  # 1. Relacional (MySQL) - Para Inventario y Finanzas
  mysql-db:
    image: mysql:8.0
    container_name: assetguard-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: inventory_db
    ports:
      - "3306:3306"

  # 2. NoSQL (MongoDB) - Para Logs de Auditoría
  mongo-db:
    image: mongo:latest
    container_name: assetguard-mongo
    ports:
      - "27017:27017"

  # 3. Caché (Redis) - REQUERIMIENTO OBLIGATORIO
  redis-cache:
    image: redis:alpine
    container_name: assetguard-redis
    ports:
      - "6379:6379"

networks:
  default:
    name: assetguard-network