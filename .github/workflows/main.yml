name: CI/CD AssetGuard Pipeline

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install Dependencies (Security Service)
        run: |
          cd services/security-service
          npm install

      - name: Install Dependencies (Inventory Service)
        run: |
          cd services/inventory-service
          npm install

      - name: Build Services
        run: |
          cd services/security-service && npm run build --if-present
          cd services/inventory-service && npm run build --if-present

  terraform-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2

      - name: Terraform Format Check
        run: cd infrastructure/terraform && terraform fmt -check